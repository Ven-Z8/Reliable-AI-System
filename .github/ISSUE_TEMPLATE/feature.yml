name: Bounded feature
description: Add one testable platform capability
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete reliability gap exists?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include positive and negative behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
    validations:
      required: true
